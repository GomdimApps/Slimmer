services:

  # Test runner
  test:
    build:
      context: .
      dockerfile: Dockerfile
    # Local source mount
    volumes:
      - .:/app
      - slimmer_vendor:/app/vendor # Container vendor preservation
    # Default test command
    command: ["vendor/bin/pest", "--configuration", "phpunit.xml", "--test-directory=test"]
    working_dir: /app

volumes:
  slimmer_vendor:
