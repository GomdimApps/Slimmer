name: so/linux-test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  php-tests:
    name: Run Pest on Alpine Linux (PHP 8.4)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Build Docker Image
        run: docker build -t slimmer-test .

      - name: 3. Execute Tests
        # Runs as a non-root user: some tests (e.g. chmod-based deletion-failure checks)
        # rely on real permission enforcement, which root bypasses.
        run: docker run --rm --user "$(id -u):$(id -g)" slimmer-test vendor/bin/pest --configuration phpunit.xml --test-directory=test

      - name: 4. Check Tar and Zstd Versions
        run: docker run --rm slimmer-test sh -c 'tar --version && zstd --version'
